<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Quicksand";
    src: url("../public/fonts/Quicksand-latin.woff2") format("woff2");
    font-weight: 400 700;
  }
  @font-face {
    font-family: "Nunito Sans";
    src: url("../public/fonts/Nunito-Sans-latin.woff2") format("woff2");
    font-weight: 300 800;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fffcfa;
    font-family: "Nunito Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* The brand wash, matching the site hero. */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 420px at 12% -10%, #fff0ef 0%, rgba(255,240,239,0) 62%),
      radial-gradient(760px 380px at 98% 108%, #ecf3fc 0%, rgba(236,243,252,0) 60%);
  }
  .motif { position: absolute; right: -110px; top: 190px; width: 620px; opacity: 0.07; }
  .inner { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 58px; }
  .name { font-family: "Quicksand", sans-serif; font-weight: 600; font-size: 34px; color: #14213d; line-height: 1; }
  .product { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6b7280; margin-top: 7px; font-weight: 700; }
  h1 {
    font-family: "Quicksand", sans-serif; font-weight: 600;
    font-size: 66px; line-height: 1.06; letter-spacing: -0.03em;
    color: #14213d; margin-top: 56px; max-width: 20ch;
  }
  p { font-size: 25px; line-height: 1.5; color: #6b7280; margin-top: 26px; max-width: 40ch; }
  .pills { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    border: 1px solid #e9e9e9; background: #ffffff; color: #14213d;
    border-radius: 999px; padding: 9px 18px; font-size: 17px; font-weight: 600;
  }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 8px; background: #ff5757; }
</style>
<div class="wash"></div>
<div class="rule"></div>
<svg class="motif" viewBox="0 0 264 200" fill="none">
  <path d="M28 66 Q130 196 232 66" stroke="#ff5757" stroke-width="34" stroke-linecap="round"/>
  <circle cx="236" cy="30" r="18" fill="#ff5757"/>
</svg>
<div class="inner">
  <div class="brand">
    <svg viewBox="0 0 264 200" fill="none">
      <path d="M28 66 Q130 196 232 66" stroke="#ff5757" stroke-width="34" stroke-linecap="round"/>
      <circle cx="236" cy="30" r="18" fill="#ff5757"/>
    </svg>
    <div>
      <div class="name">Pegasus</div>
      <div class="product">Mission OS</div>
    </div>
  </div>

  <h1>Every mission deserves world-class technology.</h1>
  <p>Funding, programmes, finances, relationships, evidence and reporting, in one place.</p>

  <div class="pills">
    <span class="pill">Funding</span>
    <span class="pill">Finance</span>
    <span class="pill">Relationships</span>
    <span class="pill">Programmes</span>
    <span class="pill">Evidence</span>
    <span class="pill">Impact</span>
    <span class="pill">Reports</span>
  </div>
</div>
